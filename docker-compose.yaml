version: "3.9"

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ml-scoring
    ports:
      - "8001:8001"
    volumes:
      # Монтируем артефакт модели снаружи — не нужно пересобирать образ
      # при обновлении модели. Положи файл рядом с docker-compose.yml.
      - ./scoring_artifact_v5.joblib:/app/scoring_artifact_v5.joblib:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s